name: Release

# Push to "testing": run the tests and publish a GitHub pre-release
# vX.Y.Z-test.N (a test build). It is NOT sent to CurseForge, and the normal
# updater ignores it ("Update Honewright (testing).bat" installs it). Only the
# newest test build is kept.
#
# Push to "main" (merging testing once the owner has tested it): run the
# tests, and if the version in Honewright.toc hasn't been released yet, publish
# GitHub release vX.Y.Z and remove that version's test builds. The Windows
# updater installs the latest release. Nothing goes to CurseForge on a push.
#
# CurseForge only gets a version when the owner decides a batch of changes is
# finished: run this workflow by hand on main with "CurseForge: upload". It
# sends the current release's zip (needs the CF_API_KEY secret and the .toc's
# X-Curse-Project-ID). "CurseForge: check" tests the token without uploading.

on:
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "CurseForge: upload = send the current release to CurseForge; check = test the token, nothing uploaded"
        type: choice
        options: [nothing, check, upload]
        default: nothing

permissions:
  contents: write

# one release run at a time, so a testing push and a main push can't trip over each other
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Tests
        run: |
          lua5.4 tests/syntax.lua Honewright
          lua5.4 tests/smoke_test.lua Honewright

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 '^## Version:' Honewright/Honewright.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # the license and name/logo notice travel with every download
          cp LICENSE Honewright/LICENSE.txt && cp NOTICE.md Honewright/NOTICE.md
          zip -r "Honewright-$VERSION.zip" Honewright -x "*.DS_Store"
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#" "updater/Update-Honewright.ps1"
          cp LICENSE updater/LICENSE.txt
          (cd updater && zip -r ../HonewrightUpdater.zip "Update Honewright.bat" "Update Honewright (testing).bat" "Update-Honewright.ps1" LICENSE.txt)
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Honewright $VERSION" > notes.md

      - name: Test build (testing branch)
        if: github.ref_name == 'testing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          N: ${{ github.run_number }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # docs-only pushes after a release: nothing new to test
            echo "::notice::v$VERSION is already released, so no test build. Bump the version to make the next one."
            for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- "^v$VERSION-test\." || true); do
              gh release delete "$t" --cleanup-tag -y || true   # another run may have removed it already
            done
            exit 0
          fi
          TAG="v$VERSION-test.$N"
          { echo "**Test build $N of Honewright $VERSION.** Not on CurseForge yet, and the normal updater won't install it."
            echo "To try it: download the Honewright zip below, or run \"Update Honewright (testing).bat\" from HonewrightUpdater.zip."
            echo
            cat notes.md; } > test-notes.md
          # keep only the newest test build
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- '-test\.' || true); do
            gh release delete "$t" --cleanup-tag -y || true   # another run may have removed it already
          done
          gh release create "$TAG" "Honewright-$VERSION.zip" HonewrightUpdater.zip --prerelease --target "$GITHUB_SHA" \
            --title "Honewright $VERSION (test $N)" --notes-file test-notes.md

      - name: Publish release if this version is new
        id: publish
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" "Honewright-$VERSION.zip" HonewrightUpdater.zip --title "Honewright $VERSION" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"
          # this version's test builds have done their job
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.prerelease) | .tag_name' | grep -- "^v$VERSION-test\." || true); do
            gh release delete "$t" --cleanup-tag -y || true   # another run may have removed it already
          done

      - name: CurseForge
        # only when the owner asks for it by hand, and only from main (never a test build)
        if: github.ref_name == 'main' && (inputs.curseforge == 'upload' || inputs.curseforge == 'check')
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          MODE: ${{ inputs.curseforge == 'upload' && 'upload' || 'check' }}
        run: |
          if ! grep -q '^## X-Curse-Project-ID:[[:space:]]*[0-9]' Honewright/Honewright.toc; then
            if [ "$MODE" = check ]; then echo "::error::No CurseForge project yet: add ## X-Curse-Project-ID to Honewright/Honewright.toc."; exit 1; fi
            echo "::notice::No CurseForge project yet (## X-Curse-Project-ID in the .toc), so nothing was sent to CurseForge."
            exit 0
          fi
          if [ -z "$CF_API_KEY" ]; then
            if [ "$MODE" = check ]; then echo "::error::There's no CF_API_KEY secret."; exit 1; fi
            echo "::notice::No CF_API_KEY secret, so nothing was sent to CurseForge."
            exit 0
          fi
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > cf_notes.md
          if [ "$MODE" = check ]; then
            python3 .github/scripts/curseforge_upload.py --toc Honewright/Honewright.toc \
              --file "Honewright-$VERSION.zip" --version "$VERSION" --changelog cf_notes.md --dry-run
            echo "::notice::CurseForge token works. Nothing was uploaded."
            exit 0
          fi
          # same zip as the GitHub release
          [ -f "Honewright-$VERSION.zip" ] || gh release download "v$VERSION" -p "Honewright-$VERSION.zip"
          python3 .github/scripts/curseforge_upload.py --toc Honewright/Honewright.toc \
            --file "Honewright-$VERSION.zip" --version "$VERSION" --changelog cf_notes.md
