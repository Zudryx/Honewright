<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#22324a"/><stop offset="1" stop-color="#090e16"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a6"/><stop offset="0.45" stop-color="#e2b14c"/><stop offset="1" stop-color="#94641a"/></linearGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e3f57"/><stop offset="1" stop-color="#121a26"/></linearGradient>
  <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
  <linearGradient id="steelR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8e3"/><stop offset="1" stop-color="#8794a6"/></linearGradient>
  <linearGradient id="guard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e9f0"/><stop offset="1" stop-color="#8c97a8"/></linearGradient>
  <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a2c18"/><stop offset="0.5" stop-color="#7a4a28"/><stop offset="1" stop-color="#4a2c18"/></linearGradient>
  <radialGradient id="pommel" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#7f8a9b"/></radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="492" height="492" rx="92" fill="url(#bg)" stroke="url(#gold)" stroke-width="18"/>
<!-- progress ring: the unfilled part dim, three quarters lit -->
<circle cx="256" cy="256" r="176" fill="none" stroke="#4ade80" stroke-opacity="0.18" stroke-width="20"/>
<circle cx="256" cy="256" r="176" fill="none" stroke="#4ade80" stroke-width="20" stroke-linecap="round"
  stroke-dasharray="829.4 1200" transform="rotate(-90 256 256)" filter="url(#glow)"/>
<rect x="142" y="142" width="228" height="228" rx="44" fill="url(#gold)"/>
<rect x="162" y="156" width="188" height="188" rx="32" fill="url(#cap)"/>
<g filter="url(#soft)" transform="translate(256 252) scale(1.35 1.08) translate(-256 -252)">
  <!-- blade -->
  <path d="M243 278 V196 L256 170 L256 278 Z" fill="url(#steelL)"/>
  <path d="M256 170 L269 196 V278 H256 Z" fill="url(#steelR)"/>
  <path d="M252 200 V270" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- crossguard -->
  <rect x="212" y="278" width="88" height="14" rx="7" fill="url(#guard)"/>
  <circle cx="212" cy="285" r="9" fill="url(#guard)"/>
  <circle cx="300" cy="285" r="9" fill="url(#guard)"/>
  <!-- grip with leather wraps -->
  <rect x="248" y="292" width="16" height="26" fill="url(#grip)"/>
  <path d="M248 300 L264 296 M248 308 L264 304 M248 316 L264 312" stroke="#a86a3a" stroke-width="2.5"/>
  <!-- pommel -->
  <circle cx="256" cy="325" r="10" fill="url(#pommel)"/>
</g>
</svg>
